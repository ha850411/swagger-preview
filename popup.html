<!DOCTYPE html>
<html lang="zh-tw">
<head>
<meta charset="UTF-8">
<title>Swagger Preview</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        width: 330px;
        min-width: 330px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #24292f;
        padding: 14px 16px;
    }
    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e1e4e8;
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .header-left img {
        width: 20px;
        height: 20px;
    }
    .title {
        font-size: 15px;
        font-weight: 600;
        color: #24292f;
        white-space: nowrap;
    }
    .lang-switch {
        display: inline-flex;
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 2px;
        gap: 2px;
    }
    .lang-btn {
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 11px;
        color: #57606a;
        font-weight: 500;
        transition: all 0.15s ease;
        line-height: 16px;
    }
    .lang-btn:hover {
        color: #24292f;
    }
    .lang-btn.active {
        background: #ffffff;
        color: #0969da;
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    #swaggerBtn {
        width: 100%;
        background-color: #1f2328;
        color: #ffffff;
        border: 1px solid rgba(255,255,255,0.1);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 12px;
        margin-bottom: 12px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        transition: background-color 0.15s ease;
        white-space: nowrap;
    }
    #swaggerBtn:hover {
        background-color: #2d333b;
    }
    .setting-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #57606a;
        margin-bottom: 12px;
        cursor: pointer;
        white-space: nowrap;
    }
    .setting-item input[type="checkbox"] {
        cursor: pointer;
        width: 15px;
        height: 15px;
        flex-shrink: 0;
    }
    .setting-item span {
        white-space: nowrap;
    }
    .tips {
        margin-top: 10px;
        padding: 10px 12px;
        background-color: #f6f8fa;
        border: 1px solid #eaeef2;
        border-radius: 6px;
        font-size: 11px;
        color: #57606a;
        line-height: 1.5;
        word-break: keep-all;
    }
    .tips strong {
        color: #24292f;
    }
</style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="./swaggerIcon.png" alt="logo">
            <span class="title">Swagger Preview</span>
        </div>
        <div class="lang-switch" id="langSwitch">
            <button type="button" class="lang-btn" data-lang="zh" id="lang-zh">中</button>
            <button type="button" class="lang-btn" data-lang="en" id="lang-en">EN</button>
        </div>
    </div>

    <!-- open btn -->
    <button type="button" id="swaggerBtn">
        <img src="./swaggerIcon.png" style="width:16px; height:16px;">
        <span id="btn-text">在目前分頁預覽</span>
    </button>

    <!-- autoDetect -->
    <label class="setting-item" for="autoDetect">
        <input type="checkbox" id="autoDetect" value="1">
        <span id="label-autodetect">Raw 自動轉向預覽 (Auto Mode)</span>
    </label>

    <div class="tips" id="tips-box">
        💡 <strong>小提示：</strong>在 GitHub 檔案頁可直接使用 <strong>Swagger</strong> 按鈕或右鍵開啟側邊抽屜，免跳轉！
    </div>

<script src="./i18n.js"></script>
<script src="./eventHandler.js"></script>
<script src="./popup.js" type="module"></script>
</body>
</html>
