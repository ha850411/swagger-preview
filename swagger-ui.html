<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="libs/swagger-ui.css" />
    <style>
        html { 
            box-sizing: border-box; 
            overflow: -moz-scrollbars-vertical; 
            overflow-y: scroll; 
        }
        *, *:before, *:after { 
            box-sizing: inherit; 
        }
        body { 
            margin: 0; 
            background: #fafafa; 
        }
        .error-message { 
            padding: 20px; 
            background: #f8d7da; 
            color: #721c24; 
            border: 1px solid #f5c6cb; 
            border-radius: 4px; 
            margin: 20px; 
        }
        .debug-info {
            padding: 10px;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            border-radius: 4px;
            margin: 10px 20px;
            font-size: 12px;
        }
        .debug-info h4 {
            margin-top: 0;
        }
        details {
            margin: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        details summary {
            cursor: pointer;
            font-weight: bold;
            padding: 5px;
        }
        details pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        #top-nav {
            display: none;
            background: #24292f;
            color: #ffffff;
            padding: 10px 20px;
            align-items: center;
            justify-content: space-between;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            border-bottom: 1px solid #d0d7de;
        }
        #top-nav a {
            color: #58a6ff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            transition: background 0.15s ease;
        }
        #top-nav a:hover {
            background: rgba(255,255,255,0.18);
        }
        #top-nav .nav-url {
            color: #8b949e;
            font-size: 12px;
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #top-nav .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div id="top-nav"></div>
    <div id="swagger-ui"></div>
    <script src="libs/swagger-ui-bundle.js"></script>
    <script src="libs/js-yaml.min.js"></script>
    <script src="i18n.js"></script>
    <script src="swagger-loader.js"></script>
</body>
</html>
